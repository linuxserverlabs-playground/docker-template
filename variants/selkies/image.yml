# The manifest for a desktop (Selkies) image; GETTING-STARTED.md shows how to swap it in. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
# Every value marked TODO is a placeholder for your app; GETTING-STARTED.md walks through them. The README, the
# build workflow and the site's image page are all generated from this file.
schema: 1
# TODO: the image name: lowercase letters, digits and dashes. Your repository is docker-<name>.
name: myapp

# TODO: GitHub logins without the @: you, and anyone who maintains the image with you. Credit, never access.
maintainers:
- your-github-login

# TODO: what the app is, in a sentence or two, with a link to its homepage. Markdown.
summary: |-
  [MyApp](https://example.org) is a desktop application, run in the browser through Selkies.

upstream:
  # TODO: the project's homepage
  url: https://example.org
  version:
    # How new releases are found: the latest stable GitHub release of this repository. Its tag is passed to the
    # Dockerfiles as build.version_arg.
    type: github_release
    # TODO: owner/repo of the upstream project, owned by an organisation
    repo: example-org/myapp
    # TODO: one regex per release asset the Dockerfiles download, matched against the file name. A build waits
    # until every one is uploaded. Drop the arm64 entry if you only build amd64.
    require_assets:
    - asset: '^myapp-.*-linux-x86_64\.deb$'
    - asset: '^myapp-.*-linux-aarch64\.deb$'
  notes:
    type: github_release
    # TODO: the same repository
    repo: example-org/myapp

release:
  branch: main
  tag: latest
  channel: stable

build:
  base: selkies
  # TODO: the ARG the Dockerfiles read the release tag from
  version_arg: MYAPP_RELEASE
  # TODO: amd64 only is allowed; then delete Dockerfile.aarch64 too
  platforms:
  - amd64
  - arm64

# What the pipeline's smoke test checks: every service stays up and the desktop answers below 500.
test:
  startup_timeout: 120
  env:
    TZ: Etc/UTC
  web:
    port: 3001
    scheme: https
    auth: user:password
    screenshot_delay: 30

runtime:
  ports:
  - internal: '3000'
    description: MyApp desktop gui HTTP, must be proxied.
  - internal: '3001'
    description: MyApp desktop gui HTTPS.
  volumes:
  - path: /config
    host_path: /path/to/myapp/config
    description: Users home directory in the container, stores local files and settings
  custom:
  - flag: shm-size
    compose: shm_size
    value: 1gb
    description: Recommended for all desktop images.

docs:
  # TODO: one or two categories, such as Image Editor, Office, Games, Development
  categories:
  - Productivity
  # TODO: a square logo URL, or delete the line
  logo: https://example.org/logo.png
  setup: |
    The application can be accessed at:

    * https://yourhost:3001/
  notices:
    strict_proxy: true
    selkies:
      enabled: true
      nvidia: true

proxy:
  port: 3001
  scheme: https
  subdomain: true
  subfolder:
    supported: false

changelog:
- date: '2026-11-02'
  text: Initial release.
